name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (unsigned)
        run: |
          set -eo pipefail
          xcodebuild \
            -project GameCollection.xcodeproj \
            -target GameCollection \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App bundle: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload GameCollection.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry GameCollection.ipa Payload
          ls -lh GameCollection.ipa
          unzip -l GameCollection.ipa | head -30

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameCollection-ipa
          path: GameCollection.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: xcodebuild.log

      - name: Publish IPA to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: IPA build ${{ github.run_number }}
          files: GameCollection.ipa
